<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>TUS Assist</title>
<link rel="stylesheet" href="popup.css">
<script src="../shared/theme.js"></script>
</head>
<body>
<h1>TUS Assist</h1>

<div class="sec">
  <div class="sec-title">CLASS（シラバス・成績）</div>
  <div class="row"><span class="lbl">保存済み授業</span><span class="val badge" id="tce-count">0</span></div>
  <div class="row"><span class="lbl">履修予定コマ</span><span class="val badge" id="tce-planned">0</span></div>
  <div class="row"><span class="lbl">履修予定 合計単位</span><span class="val badge" id="tce-credits">0.0</span></div>
  <div class="row"><span class="lbl">成績リンク済</span><span class="val badge" id="tce-linked">0</span></div>
  <label class="chk"><input type="checkbox" id="tce-sidebar-toggle" checked> CLASS 上にサイドバーを表示</label>
</div>

<div class="sec">
  <div class="sec-title">LETUS（課題・提出）</div>
  <div id="body"></div>
</div>

<div class="sec">
  <div class="sec-title">ダークモード</div>
  <label class="fld"><span>モード</span>
    <select id="tus-mode">
      <option value="off">オフ</option>
      <option value="on">常に入れる</option>
      <option value="auto">自動で切り替える</option>
    </select>
  </label>
  <div id="tus-auto" hidden>
    <label class="fld"><span>切り替えの条件</span>
      <select id="tus-schedule">
        <option value="time">時刻を指定</option>
        <option value="sun">日の出 〜 日の入り</option>
        <option value="system">OS の設定に合わせる</option>
      </select>
    </label>
    <label class="fld" id="tus-time-row"><span>暗くなる時刻 〜 明るくなる時刻</span>
      <span class="times"><input type="time" id="tus-start" step="60"><i>〜</i><input type="time" id="tus-end" step="60"></span>
    </label>
    <p class="hint" id="tus-next"></p>
  </div>
  <div class="targets">
    <label class="chk"><input type="checkbox" id="tus-t-class"> CLASS</label>
    <label class="chk"><input type="checkbox" id="tus-t-letus"> LETUS</label>
    <label class="chk"><input type="checkbox" id="tus-t-ui"> 拡張の画面</label>
  </div>
</div>

<button id="tce-open-dashboard">CLASS ダッシュボードを開く</button>
<button id="options" class="secondary">LETUS の設定を開く</button>
<button id="tce-open-class" class="secondary">CLASS の画面に飛ぶ</button>

<script src="../letus/shared/defaults.js"></script>
<script src="../letus/shared/dateutil.js"></script>
<script src="../letus/shared/game.js"></script>
<script src="popup.js"></script>
</body>
</html>
